<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login | Birkti Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #fffdf8;
        --surface: #fffaf1;
        --primary: #c89b2d;
        --primary-dark: #9c700f;
        --dark: #111111;
        --muted: #5a5143;
        --line: rgba(200, 155, 45, 0.18);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "Inter", sans-serif;
        background: radial-gradient(circle at top, rgba(200, 155, 45, 0.12), transparent 22%), var(--bg);
        color: var(--dark);
      }

      .login-shell {
        width: min(440px, calc(100% - 2rem));
        background: linear-gradient(180deg, #fffdfb 0%, #fffaf1 100%);
        border: 1px solid var(--line);
        border-radius: 28px;
        box-shadow: 0 24px 48px rgba(17, 17, 17, 0.08);
        padding: 2rem;
      }

      .login-shell h1 {
        margin: 0 0 0.5rem;
        font-size: clamp(2rem, 4vw, 2.5rem);
        letter-spacing: -0.06em;
      }

      .login-shell p {
        margin: 0 0 1.5rem;
        color: var(--muted);
      }

      form {
        display: grid;
        gap: 1rem;
      }

      .field-group {
        display: grid;
        gap: 0.45rem;
      }

      label {
        font-size: 0.9rem;
        font-weight: 700;
      }

      input {
        width: 100%;
        border: 1px solid rgba(200, 155, 45, 0.25);
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.9);
        padding: 0.9rem 1rem;
        font: inherit;
        color: var(--dark);
      }

      input:focus {
        outline: none;
        border-color: rgba(200, 155, 45, 0.8);
        box-shadow: 0 0 0 4px rgba(200, 155, 45, 0.12);
      }

      button {
        border: 0;
        border-radius: 999px;
        padding: 0.9rem 1.25rem;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
        background: linear-gradient(135deg, var(--primary), #e9c35b);
        color: #17130d;
        box-shadow: 0 12px 22px rgba(200, 155, 45, 0.22);
      }

      button:hover {
        transform: translateY(-1px);
      }

      .login-status {
        min-height: 1.3rem;
        margin: 0;
        color: var(--primary-dark);
        font-weight: 600;
      }

      .back-link {
        display: inline-block;
        margin-top: 1rem;
        font-size: 0.95rem;
        color: var(--primary-dark);
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main class="login-shell">
      <h1>Admin Login</h1>
      <p>Sign in to manage your portfolio content.</p>

      <form id="admin-login-form" novalidate>
        <div class="field-group">
          <label for="adminUsername">Username</label>
          <input id="adminUsername" name="adminUsername" type="text" placeholder="admin" required />
        </div>

        <div class="field-group">
          <label for="adminPassword">Password</label>
          <input id="adminPassword" name="adminPassword" type="password" placeholder="Enter password" required />
        </div>

        <button type="submit">Login</button>
        <p id="loginStatus" class="login-status" aria-live="polite"></p>
      </form>

      <a class="back-link" href="index.html">← Back to portfolio</a>
    </main>

    <script src="admin.js"></script>
  </body>
</html>
